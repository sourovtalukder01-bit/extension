

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
     <h2>🤖 Booking Bot Setup</h2>

     <label >Appointment Type:</label>
     <select  id="typeValue">
        <option value="0">Submission Schengen visa (Short term - Type C)</option>
        <option value="2">National visa (long term - type D)</option>
        <option value="5">Premium lounge(Optional service at an additional change)</option>
        <option value="6">Premium Time(optional Service at an additional charge)</option>
     </select>

     <label >Booking For</label>
     <select  id="bookingForValue">
        <option value="0">Individual</option>
        <option value="1">Group(Family/Traveler)</option>
     </select>
    
    <label>Target Dates:</label>
    <input type="text" id="targetDates" placeholder="12/05/2026, 14/05/2026">
    
    <label>Passport Number:</label>
    <input type="text" id="passportNo" placeholder="A1234567">
    
    <label>Date of Birth:</label>
    <input type="text" id="dob" placeholder="01/01/1990">
    
    <label>Email Address:</label>
    <input type="email" id="email" placeholder="user@email.com">
    
    <hr>
    
    <label>Telegram Bot Token:</label>
    <input type="text" id="tgToken" placeholder="789456:ABC-DEF...">
    
    <label>Telegram Chat ID:</label>
    <input type="text" id="tgChatId" placeholder="123456789">
    
    <button id="startBtn">Save & Start Bot</button>
    <button id="stopBtn" style="background-color: red;">Stop Bot</button>

    <p id="status"></p>

    <script src="popup.js"></script>
</body>
</html>
